services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aqueduct
      POSTGRES_PASSWORD: aqueduct
      POSTGRES_DB: aqueduct
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqueduct -d aqueduct"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mocktarget:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: mocktarget
    command: ["-addr", ":9100", "-seed", "20261112"]
    ports: ["9100:9100"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9100/api/v1/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: collector
    command: ["-config", "configs/sites.docker.yaml", "-mode", "all"]
    environment:
      WORKER_ID: worker-a
      DATABASE_URL: postgres://aqueduct:aqueduct@db:5432/aqueduct?sslmode=disable
      REDIS_URL: redis://cache:6379/0
    ports: ["8081:8081"]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      mocktarget:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro

volumes:
  pgdata:
