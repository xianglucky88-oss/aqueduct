services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aqueduct
      POSTGRES_PASSWORD: aqueduct
      POSTGRES_DB: aqueduct
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqueduct -d aqueduct"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mocktarget:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: mocktarget
    command: ["-addr", ":9100", "-seed", "20261112"]
    ports: ["9100:9100"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9100/api/v1/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  # 两个副本共享同一数据库，通过站点租约竞争工作。本地用
  # docker compose up --scale collector=3 可模拟滚动升级与接管。
  collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: collector
    command: ["-config", "configs/sites.docker.yaml", "-mode", "all"]
    environment:
      # Pod/副本名必须唯一；Kubernetes 注入 metadata.name，
      # 本地 compose 用容器主机名即可。
      WORKER_ID: ${WORKER_ID:-}
      DATABASE_URL: postgres://aqueduct:aqueduct@db:5432/aqueduct?sslmode=disable
      REDIS_URL: redis://cache:6379/0
      LEASE_TTL: 45s
      LEASE_RENEW_INTERVAL: 15s
      SHUTDOWN_GRACE: 20s
      MAX_CONCURRENT_SITES: 2
    ports: ["8081:8081"]
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      mocktarget:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./configs:/app/configs:ro

volumes:
  pgdata:
