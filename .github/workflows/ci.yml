name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqueduct
          POSTGRES_PASSWORD: aqueduct
          POSTGRES_DB: aqueduct
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqueduct -d aqueduct"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -race
        env:
          # 存储层的租约/围栏/检查点集成用例需要真实 PostgreSQL。
          AQUEDUCT_TEST_DATABASE_URL: postgres://aqueduct:aqueduct@localhost:5432/aqueduct?sslmode=disable
      - name: build
        run: go build ./...

  compose-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: boot stack (two replicas)
        run: docker compose up -d --build --scale collector=2
      - name: wait for readiness
        run: sh scripts/wait_for.sh http://localhost:8081/readyz 120
      - name: collect once
        run: |
          curl -fsS -X POST http://localhost:8081/collect/supplier | head -c 400
      - name: verify
        run: python3 scripts/verify_collector.py --base http://localhost:8081
      - name: graceful restart keeps instance ready
        run: |
          cid=$(docker compose ps -q collector | head -1)
          docker restart --time 45 "$cid"
          sh scripts/wait_for.sh http://localhost:8081/readyz 90
      - name: dump logs
        if: always()
        run: docker compose logs --tail=200
