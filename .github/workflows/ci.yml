name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -race
      - name: build
        run: go build ./...

  compose-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: boot stack
        run: docker compose up -d --build
      - name: wait for api
        run: sh scripts/wait_for.sh http://localhost:8081/healthz 120
      - name: collect once
        run: |
          curl -fsS -X POST http://localhost:8081/collect/supplier | head -c 400
      - name: verify
        run: python3 scripts/verify_collector.py --base http://localhost:8081 || true
      - name: dump logs
        if: always()
        run: docker compose logs --tail=200
