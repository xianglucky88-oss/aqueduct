database_url: postgres://aqueduct:aqueduct@db:5432/aqueduct?sslmode=disable
redis_url: redis://cache:6379/0

sites:
  - id: supplier
    base_url: http://mocktarget:9100
    path: /supplier/items
    mode: cursor
    page_size: 50
    interval: 30s
    rps: 4
    enabled: true
    # 可选的站点级分布式请求预算。留空（其余站点即如此）时：
    # rate=rps、burst=ceil(rps)、max_inflight=1、max_attempts=1（不重试），
    # 与本特性引入前的含义完全一致。
    budget:
      rate: 4
      burst: 6
      max_inflight: 2
      max_attempts: 3
      fallback_fraction: 0.5

  - id: catalog
    base_url: http://mocktarget:9100
    path: /catalog/items
    mode: page
    page_size: 40
    interval: 45s
    rps: 2
    enabled: true

  - id: stock
    base_url: http://mocktarget:9100
    path: /stock/items
    mode: cursor
    page_size: 60
    interval: 60s
    rps: 2
    enabled: true

  - id: notice
    base_url: http://mocktarget:9100
    path: /notice/items
    mode: single
    page_size: 100
    interval: 120s
    rps: 1
    enabled: true
