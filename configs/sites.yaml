database_url: postgres://aqueduct:aqueduct@localhost:5432/aqueduct?sslmode=disable
redis_url: redis://localhost:6379/0

# 运行参数（与 deploy/k8s.yaml 保持同一组默认值）。
lease_ttl: 45s
lease_renew_interval: 15s
shutdown_grace: 20s
scheduler_poll: 1s
max_concurrent_sites: 2
readiness_cache_ttl: 2s
db_max_open_conns: 8
db_max_idle_conns: 2
max_pages: 200

sites:
  - id: supplier
    base_url: http://localhost:9100
    path: /supplier/items
    mode: cursor
    page_size: 50
    interval: 30s
    rps: 4
    enabled: true

  - id: catalog
    base_url: http://localhost:9100
    path: /catalog/items
    mode: page
    page_size: 40
    interval: 45s
    rps: 2
    enabled: true

  - id: stock
    base_url: http://localhost:9100
    path: /stock/items
    mode: cursor
    page_size: 60
    interval: 60s
    rps: 2
    enabled: true

  - id: notice
    base_url: http://localhost:9100
    path: /notice/items
    mode: single
    page_size: 100
    interval: 120s
    rps: 1
    enabled: true
